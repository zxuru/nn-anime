[package]
name = "nn-anime-desktop"
version = "0.4.0"
edition = "2021"
# `tauri-plugin-single-instance` (T156) exige Rust >= 1.90. El anfitrión no usa
# nada más nuevo que eso, y declararlo hace que el fallo salga al compilar y no
# en el CI de una release.
rust-version = "1.90"
publish = false

# Sin `[lib]`: es un binario de ventana y nada más. El nombre tiene que ser
# `nn-anime-desktop` porque el servidor, que se instala **al lado**, ya se llama
# `nn-anime`; los dos conviven en el mismo directorio.
[[bin]]
name = "nn-anime-desktop"
path = "src/main.rs"

[build-dependencies]
# `tauri-build` lee `tauri.conf.json` y genera el contexto de la aplicación. Es
# lo que permite compilar con `cargo build --release` sin el CLI de Tauri: el
# empaquetado sigue siendo el de `scripts/package.ts`, no el de `tauri bundle`.
tauri-build = { version = "2", features = [] }
# El SHA-256 del servidor se calcula al compilar y se comprueba al extraerlo.
sha2 = "0.11"

[dependencies]
# `tray-icon`: el icono de la bandeja, que es la única señal de que la aplicación
# sigue viva cuando la ventana está oculta. `image-png`: lo que hace falta para
# meter el icono **dentro** del binario (`Image::from_bytes`); sin esa
# característica habría que leerlo del disco al arrancar y no existiría en la
# máquina de quien instaló el programa.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Instancia única. Sin él, dos lanzamientos conviven sobre la misma base sin decir
# nada y cerrar uno deja al otro sirviendo. Exige Rust >= 1.90.
tauri-plugin-single-instance = "2"
# El diálogo nativo de carpeta. Es la única superficie que se abre en el
# anfitrión: un comando que devuelve una ruta y nada más. Sin `rfd` habría que
# empaquetar el plugin de diálogo, que añade más comandos de los que hacen falta.
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# El servidor extraído se verifica contra el hash que calculó `build.rs`.
sha2 = "0.11"

# Auto-actualización, **sólo en escritorio**. `tauri-plugin-updater` comprueba
# `latest.json`, verifica la firma del instalador y lo ejecuta; el plugin de
# proceso aporta `relaunch()`, que en macOS y Linux hay que llamar después de
# instalar. Van con `target` y no en `[dependencies]` porque la documentación del
# plugin lo pide así. La sección no se puede fusionar con las de `cfg(windows)` y
# `cfg(linux)` de abajo: son tres predicados distintos.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
# **Pendiente, y no hecho.** El Job Object es el único seguro que existe en Windows
# —ahí no hay `PR_SET_PDEATHSIG`— y **no está escrito**: `guards.rs` sólo pone
# `PR_SET_PDEATHSIG` en Linux y no hace nada en el resto. La dependencia y sus
# características están puestas para cuando se escriba, y están aquí y no en un
# commit futuro porque son justo las que hay que activar. Mientras tanto, en Windows
# un `kill` seco del anfitrión deja el servidor vivo: es el riesgo residual que
# declara `SPEC-desktop.md`, y lo cuenta `tasks/done/T155.md`.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  # El testigo del proceso: nivel de integridad y usuario, para registrarlos y
  # avisar cuando la etiqueta `Low` impide arrancar.
  "Win32_Security",
  # `MessageBoxW`: el único aviso que funciona sin webview ni archivos.
  "Win32_UI_WindowsAndMessaging",
  # La entrada de desinstalación: distingue una copia instalada de un `.exe` suelto
  # sin depender de `portable.txt`, que habla de dónde van los datos y no de cómo se
  # entregó el binario.
  "Win32_System_Registry",
  # `SYNCHRONIZE`, el derecho con el que se espera a que muera el proceso viejo en
  # un reemplazo portable.
  "Win32_Storage_FileSystem",
] }
# La descarga del `.exe` portable, su firma y el reemplazo en sitio. `reqwest` y
# `minisign-verify` ya vienen con `tauri-plugin-updater`; aquí se declaran porque
# se usan directamente y Cargo exige nombrarlos. El backend TLS es el mismo que el
# del plugin (`rustls` sin proveedor + `ring`), para no tener dos almacenes de
# certificados en el mismo binario.
base64 = "0.23"
minisign-verify = "0.3"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
  "stream",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
# El anfitrión es una ventana alrededor de un servidor que ya está compilado: no
# hay razón para pagar tamaño por él.
codegen-units = 1
lto = true
opt-level = "s"
strip = true
