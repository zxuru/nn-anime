name: Herramientas de empaquetado
description: Lo que cada sistema necesita para armar su artefacto portable, sin que haga falta nada en la máquina de nadie.

# Sólo Linux necesita algo que no viene en la imagen de GitHub:
#
#  - Windows: nada. El archivo único es una copia del anfitrión y la firma la hace
#    `bun tauri signer`.
#  - Linux: `appimagetool`, que produce el AppImage. Se descarga fijado **por
#    versión y por SHA256**: la versión sola no basta, porque un archivo publicado
#    se puede reemplazar y aquí se está ejecutando lo que se descarga.
#  - macOS: nada. `ditto`, `codesign` y `xcrun` vienen con el sistema.
#
# Está como acción compuesta y no repetido en cada workflow porque la lista de
# hashes duplicada es una lista que se desincroniza.

runs:
  using: composite
  steps:
    - name: appimagetool (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/tools"
        cd "$RUNNER_TEMP/tools"

        curl -fsSL -o appimagetool \
          "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
        echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -

        chmod +x appimagetool
        echo "APPIMAGETOOL_PATH=$RUNNER_TEMP/tools/appimagetool" >> "$GITHUB_ENV"

        echo 'appimagetool listo'
