name: Release

# Los artefactos portables, desde un tag `vX.Y.Z`.
#
# El tag lo crea el PR de release de `release-please` (que además deja el changelog escrito) y
# siempre en borrador: `force-tag-creation` hace que el tag exista aunque la release esté en
# borrador, que es lo que permite que este workflow se dispare con el tag.
#
# `workflow_dispatch` existe para poder recorrer el camino entero sin publicar nada: por defecto
# sólo sube los artefactos al resumen del propio workflow. Es la forma de probar la cadena de
# empaquetado sin gastar un número de versión.
#
# Aquí no se publica código sin el listón pasado: este workflow corre los tipos, el estilo, la
# auditoría y las pruebas antes de compilar, porque un push de tag no dispara el CI de la rama.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a construir. Vacío: la de package.json.'
        required: false
        type: string
      publish:
        description: 'Publicar la release en GitHub. Sin marcar: sólo artefactos.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Lo primero es saber **qué** se está publicando. Un tag que no coincide con la versión del
  # repositorio produce un artefacto que dice una cosa y un `--version` que dice otra, y eso no se
  # arregla después: hay que borrar la release.
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publicar: ${{ steps.version.outputs.publicar }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Caché de Bun
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Instalar
        run: bun install --frozen-lockfile

      - name: Instalar el gancho de pre-commit
        run: bun run hooks:instalar

      - name: Resolver la versión y el tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          ENTRADA: ${{ inputs.version }}
          PUBLICAR: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
            # Falla si el tag no empieza por `v` o no coincide con los diez `package.json`.
            bun run version:check "$tag"
            version="${tag#v}"
            publicar=true
          else
            version="${ENTRADA:-$(bun run scripts/version.ts current)}"
            bun run version:check
            tag="v$version"
            publicar="${PUBLICAR:-false}"
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publicar=$publicar"
          } >> "$GITHUB_OUTPUT"
          echo "Se va a construir la $version ($tag); publicar: $publicar"

      - name: Auditar las dependencias
        run: bun audit

      - name: Tipos
        run: bun run typecheck

      - name: Estilo y formato
        run: bun run lint

      - name: Pruebas
        run: bun test

  # La imagen de contenedor. No crea una release: publica en GHCR y nada más, y `publicar`
  # depende de este trabajo para que la release no anuncie una imagen que no existe todavía.
  #
  # Multi-arquitectura porque el NAS y el servidor pueden ser arm64, y la imagen de Bun existe
  # para las dos. Con `publish` sin marcar se construye igual, sin subir nada: es la forma de
  # probar la cadena sin gastar un tag.
  docker:
    needs: comprobar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar QEMU para arm64
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Entrar en GHCR
        if: needs.comprobar.outputs.publicar == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.comprobar.outputs.publicar == 'true' }}
          tags: |
            ghcr.io/zxuru/rona:${{ needs.comprobar.outputs.version }}
            ghcr.io/zxuru/rona:latest
          labels: |
            org.opencontainers.image.version=${{ needs.comprobar.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          # `scope` propio, y la caché del CI de la PR como segunda fuente: las capas que ya
          # construyó el trabajo `docker` de `ci.yml` —el `bun install` de la imagen, sobre
          # todo— se reaprovechan aquí, y las de la release (multi-arquitectura) no ensucian
          # las suyas. `type=gha` sin `scope` comparte un único espacio por repositorio y las
          # dos builds se pisan el índice.
          cache-from: |
            type=gha,scope=rona-release
            type=gha,scope=rona-ci
          cache-to: type=gha,mode=max,scope=rona-release

  # Un artefacto portable por plataforma. La firma va aquí dentro y es **condicional**: si el
  # secreto no está, el artefacto sale sin firmar, con las advertencias normales del sistema. Una
  # build que falla porque falta un certificado es una build que nadie puede hacer.
  #
  # El de Windows necesita la clave minisign del updater: sin ella no hay `.sig` ni `latest.json`,
  # y la release no se publica a propósito —un `.exe` que no se puede actualizar es peor que no
  # publicar—.
  portables:
    needs: comprobar
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-latest
            target: darwin-arm64
          - os: macos-latest
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # `secrets` no está disponible en el `if` de un paso de forma fiable; el `env` del job sí, y
      # a partir de ahí la decisión es una comparación de cadenas.
      FIRMAR_WINDOWS: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
      FIRMAR_MACOS: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
      # Sin la clave del updater no hay `.sig` ni `latest.json`. Un `workflow_dispatch` con
      # «publish» sin marcar puede recorrer la cadena igual; una release de verdad falla en
      # `publicar` porque el manifiesto no existe.
      FIRMAR_UPDATER: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Caché de Bun
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Instalar
        run: bun install --frozen-lockfile

      - name: Construir la interfaz
        run: bun run build

      # El orden es parte del contrato del archivo único: `build.rs` embebe el
      # servidor **al compilar el anfitrión**, así que el servidor tiene que existir
      # —y estar firmado, si hay certificado— antes. Al revés, el `.exe` saldría con
      # el servidor de ayer o sin ninguno y arrancaría mintiendo.
      - name: Rust al día
        run: rustup update stable --no-self-update

      - name: Dependencias del webview (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      # `Swatinem/rust-cache` y no `actions/cache` sobre `target/`: el directorio de Tauri pesa
      # varios GB, `actions/cache` lo sube entero y su clave cambia con `Cargo.lock`, así que cada
      # subida de dependencia empezaba en frío. Este poda lo que no acelera la compilación y separa
      # registro de artefactos.
      #
      # `key` con el objetivo porque las dos vueltas de macOS compilan triples distintos sobre el
      # mismo `target/`: sin separarlas se pisan la caché (la segunda guarda falla en silencio y la
      # siguiente vuelta recompila).
      - name: Caché de Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.target }}

      # 1) El servidor, y **sin** artefacto. En Windows se firma aquí, antes de que
      #    el anfitrión lo embeba; si se firmara después, el `.exe` único llevaría
      #    dentro un servidor sin firmar.
      - name: Compilar y probar el ejecutable
        run: bun run package --solo-ejecutable --target=${{ matrix.target }}

      # --- Windows: firma condicional, servidor primero --------------------
      - name: Preparar el certificado de Windows
        if: runner.os == 'Windows' && env.FIRMAR_WINDOWS == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          # Se escribe a un archivo temporal y se borra al final. El contenido del certificado y su
          # contraseña no se imprimen nunca: lo que se enseña es que existe.
          $ruta = Join-Path $env:RUNNER_TEMP 'rona.pfx'
          [IO.File]::WriteAllBytes($ruta, [Convert]::FromBase64String($env:PFX_BASE64))
          "PFX_PATH=$ruta" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # Además se importa al almacén del usuario: es lo que permite firmar por huella sin un
          # `signCommand` que tendría que llevar rutas y contraseñas en el repositorio.
          $segura = ConvertTo-SecureString -String $env:PFX_PASSWORD -AsPlainText -Force
          $certificado = Import-PfxCertificate -FilePath $ruta `
            -CertStoreLocation Cert:\CurrentUser\My -Password $segura
          "WINDOWS_CERT_THUMBPRINT=$($certificado.Thumbprint)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "certificado de Windows preparado en $ruta"

      - name: Firmar el servidor de Windows
        if: runner.os == 'Windows' && env.FIRMAR_WINDOWS == 'true'
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'no se encontró signtool.exe (Windows SDK)' }

          # El servidor se firma **antes** de que el anfitrión lo embeba: `include_bytes!`
          # copia los bytes tal cual, así que un servidor firmado después no llegaría
          # firmado al `.exe` único.
          $ruta = 'build\package\windows-x64\rona.exe'
          if (-not (Test-Path $ruta)) { throw "no está el servidor que hay que firmar: $ruta" }

          & $signtool.FullName sign /f "$env:PFX_PATH" /p "$env:PFX_PASSWORD" /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 $ruta
          if ($LASTEXITCODE -ne 0) { throw "signtool falló con $LASTEXITCODE en $ruta" }

          & $signtool.FullName verify /pa $ruta
          Write-Output 'servidor de Windows firmado'

      # 2) El anfitrión del **objetivo de esta vuelta**, que no siempre es el de la
      #    máquina: `macos-latest` es arm64 y de ahí salen los dos `.zip`. El triple
      #    de Rust lo resuelve `desktop:build`, y la comprobación de que el binario
      #    es del objetivo lo hace el propio paso. En Windows va **después** del
      #    servidor porque `build.rs` lo embebe al compilar.
      - name: Compilar el anfitrión
        run: bun run desktop:build --target=${{ matrix.target }}

      - name: Firmar el anfitrión de Windows
        if: runner.os == 'Windows' && env.FIRMAR_WINDOWS == 'true'
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'no se encontró signtool.exe (Windows SDK)' }

          # El `.exe` único es una copia del anfitrión, así que los dos heredan la
          # firma de este paso.
          $ruta = 'desktop\src-tauri\target\x86_64-pc-windows-msvc\release\rona-desktop.exe'
          if (-not (Test-Path $ruta)) { throw "no está el anfitrión que hay que firmar: $ruta" }

          & $signtool.FullName sign /f "$env:PFX_PATH" /p "$env:PFX_PASSWORD" /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 $ruta
          if ($LASTEXITCODE -ne 0) { throw "signtool falló con $LASTEXITCODE en $ruta" }

          & $signtool.FullName verify /pa $ruta
          Write-Output 'anfitrión de Windows firmado'

      # --- macOS: firma y notarización condicionales ----------------------
      - name: Preparar el certificado de macOS
        if: runner.os == 'macOS' && env.FIRMAR_MACOS == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/rona.keychain"
          password="$(uuidgen)"

          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificado.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificado.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$keychain"
          rm -f "$RUNNER_TEMP/certificado.p12"

          # La identidad se deduce del certificado importado en vez de ser otro secreto: en un
          # runner limpio es el único que hay, y un secreto de más es un sitio más donde
          # desincronizarse.
          identidad="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$identidad" ]; then
            echo "el certificado importado no es un Developer ID Application" >&2
            security find-identity -v -p codesigning "$keychain" >&2
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$identidad" >> "$GITHUB_ENV"
          echo "identidad de firma preparada: $identidad"

      - name: Limpiar el certificado de Windows
        if: always() && runner.os == 'Windows' && env.FIRMAR_WINDOWS == 'true'
        shell: pwsh
        run: |
          Remove-Item -Force "$env:PFX_PATH" -ErrorAction SilentlyContinue
          if ($env:WINDOWS_CERT_THUMBPRINT) {
            $ruta = "Cert:\CurrentUser\My\$env:WINDOWS_CERT_THUMBPRINT"
            if (Test-Path $ruta) { Remove-Item $ruta -Force -ErrorAction SilentlyContinue }
          }

      # --- Linux: la herramienta del AppImage -----------------------------
      - name: Preparar las herramientas de empaquetado
        uses: ./.github/actions/herramientas

      # --- El artefacto portable, ya con el ejecutable firmado -------------
      # macOS y Linux: el `.zip` del `.app` y el AppImage. Windows no pasa por aquí:
      # su archivo único es la copia del anfitrión que hace `package:unico`.
      - name: Armar el artefacto portable
        if: runner.os != 'Windows'
        env:
          # Vacíos si no hay certificado, y entonces `macos.ts` no firma ni notariza.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bun run package --solo-artefacto --target=${{ matrix.target }}

      # El archivo único va **después** de firmar el anfitrión: el `.exe` que se
      # descarga tiene que llevar esa firma dentro.
      - name: Ejecutable único (Windows)
        if: runner.os == 'Windows'
        run: bun run package:unico

      # El `.exe` único no pasa por ningún instalador: se reemplaza a sí mismo, así
      # que su firma minisign viaja en `latest.json` y la verifica el anfitrión
      # antes de tocar el archivo. La clave es la misma del updater.
      - name: Firmar el archivo único para el updater (Windows)
        if: runner.os == 'Windows' && env.FIRMAR_UPDATER == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $unico = Get-ChildItem release -Filter 'rona-*-windows-x64.exe' | Select-Object -First 1
          if (-not $unico) { throw 'no hay archivo único que firmar' }
          bun tauri signer sign --app-version ${{ needs.comprobar.outputs.version }} $unico.FullName
          if (-not (Test-Path "$($unico.FullName).sig")) { throw 'no se generó la firma del .exe único' }

      # El manifiesto que consulta la aplicación. Antes lo escribía `tauri-action`
      # con el instalador NSIS; ahora lo arma este paso con la URL y la firma del
      # único. Las dos entradas de Windows apuntan al mismo `.exe`.
      - name: Escribir latest.json (Windows)
        if: runner.os == 'Windows' && env.FIRMAR_UPDATER == 'true'
        shell: pwsh
        run: |
          $unico = Get-ChildItem release -Filter 'rona-*-windows-x64.exe' | Select-Object -First 1
          if (-not $unico) { throw 'no hay archivo único para latest.json' }
          if (-not (Test-Path "$($unico.FullName).sig")) { throw 'falta la firma del archivo único' }

          $url = "https://github.com/${{ github.repository }}/releases/download/${{ needs.comprobar.outputs.tag }}/$($unico.Name)"
          bun run scripts/package/portable-manifest.ts `
            ${{ needs.comprobar.outputs.version }} "$($unico.FullName).sig" $url release/latest.json

      - name: Comprobar el subsistema de los ejecutables (Windows)
        if: runner.os == 'Windows'
        # `shell: pwsh` y barras normales por el mismo motivo que en `ci.yml`:
        # sin declarar el intérprete, actionlint analiza el paso como `bash` y
        # `build\package\…` pierde las barras.
        shell: pwsh
        run: |
          bun run scripts/package/pe.ts build/package/windows-x64/rona.exe console
          bun run scripts/package/pe.ts desktop/src-tauri/target/x86_64-pc-windows-msvc/release/rona-desktop.exe windows

          # Y el archivo único: mismo subsistema `windows` que el anfitrión, porque
          # es su copia. Si el nombre del artefacto cambia, esto falla aquí y no en
          # la página de descargas.
          $unico = Get-ChildItem -Path release -Filter 'rona-*-windows-x64.exe' | Select-Object -First 1
          if (-not $unico) { throw 'no hay .exe único en release/' }
          bun run scripts/package/pe.ts "$($unico.FullName)" windows

      - name: Subir los artefactos portables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portables-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          # Una release se publica en minutos, no en semanas: guardar 90 MB por plataforma más
          # tiempo del necesario es pagar por nada.
          retention-days: 7

  # Un solo sitio con todos los artefactos, y el resumen de ellos. Los checksums se calculan aquí y
  # no en cada plataforma: tres `SHA256SUMS.txt` con el mismo nombre en la misma release dejarían el
  # que sobreviviera hablando sólo de una.
  publicar:
    needs: [comprobar, portables, docker]
    if: needs.comprobar.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Lo mínimo para escribir la release. Nada más: ni paquetes, ni issues, ni acciones.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      # Sólo los portables. El trabajo `docker` deja en el run un artefacto
      # `.dockerbuild` de buildx que no es parte de la release; bajarlo con
      # `pattern` evita que acabe en la página de descargas y en los checksums.
      - name: Bajar los artefactos
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: portables-*
          path: release
          merge-multiple: true

      - name: Resumir los artefactos con SHA256
        run: bun run scripts/package/checksums.ts release

      - name: Enseñar qué se va a publicar
        run: |
          {
            echo "### RoNa ${{ needs.comprobar.outputs.version }}"
            echo
            echo "| Archivo | Tamaño |"
            echo "|---|---|"
            # `find` y no `ls`: los nombres de estos archivos llevan puntos y guiones, y leer la
            # salida de `ls` es la forma clásica de equivocarse con ellos.
            find release -maxdepth 1 -type f -printf '%f %s\n' |
              sort |
              awk '{printf "| %s | %.1f MB |\n", $1, $2/1048576}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Crear el borrador y publicarlo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.comprobar.outputs.tag }}
          VERSION: ${{ needs.comprobar.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # El cuerpo del changelog sale del `CHANGELOG.md` que escribió `release-please`: la
          # sección de esta versión, ni una línea más.
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" { dentro = 1; next }
              dentro && /^## \[/ { dentro = 0 }
              dentro { print }
            ' CHANGELOG.md > "$RUNNER_TEMP/notas.md"
          fi

          # Resolver el release **por id**, nunca por tag. `GET /releases/tags/$TAG` no devuelve
          # borradores, y por eso el `gh release create` de antes creaba un segundo release con el
          # mismo tag: los assets iban a uno y `gh release edit` publicaba el otro. Pasó con la 0.3.1.
          listar() {
            gh api --paginate "repos/$REPO/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$TAG\" and .draft == $1) | .id"
          }
          primera() { awk 'NR == 1 { print; exit }' <<< "$1"; }

          publicado="$(primera "$(listar false)")"
          if [ -n "$publicado" ]; then
            echo "ya hay una release publicada para $TAG (id $publicado): no se toca" >&2
            exit 1
          fi

          borrador="$(primera "$(listar true)")"
          if [ -z "$borrador" ]; then
            cuerpo="$RUNNER_TEMP/cuerpo.json"
            if [ -s "$RUNNER_TEMP/notas.md" ]; then
              jq -n --arg tag "$TAG" --rawfile body "$RUNNER_TEMP/notas.md" \
                '{tag_name: $tag, name: $tag, draft: true, body: $body}' > "$cuerpo"
            else
              jq -n --arg tag "$TAG" '{tag_name: $tag, name: $tag, draft: true, body: ""}' > "$cuerpo"
            fi
            borrador="$(gh api --method POST "repos/$REPO/releases" --input "$cuerpo" --jq .id)"
            echo "borrador creado: $borrador"
          fi

          # Un reintento sobre el mismo borrador no debe chocar con los assets del
          # intento anterior. Se borran **sólo los que este job vuelve a subir**:
          # los portables, sus firmas, `latest.json` y `SHA256SUMS.txt`.
          upload_url="$(gh api "repos/$REPO/releases/$borrador" --jq .upload_url)"
          upload_url="${upload_url%\{*}"

          for f in release/*; do
            [ -f "$f" ] || continue
            nombre="$(basename "$f")"
            id="$(gh api --paginate "repos/$REPO/releases/$borrador/assets?per_page=100" \
              --jq ".[] | select(.name == \"$nombre\") | .id" | head -n 1)"
            if [ -n "$id" ]; then gh api --method DELETE "repos/$REPO/releases/assets/$id" >/dev/null; fi
          done

          for f in release/*; do
            [ -f "$f" ] || continue
            echo "subiendo $(basename "$f")"
            gh api --method POST "$upload_url?name=$(basename "$f")" \
              -H "Content-Type: application/octet-stream" --input "$f" >/dev/null
          done

          # Antes de publicar se comprueba qué quedó en el borrador. Publicar sin mirar es lo que
          # dejó la 0.3.1 vacía y en verde. El updater depende de dos assets: `latest.json` y el
          # `.sig` del `.exe` único. Si faltan, la release se ve bien y todos los clientes se
          # quedan sin actualizar; por eso se comprueban aquí, no en el cliente.
          nombres="$(gh api --paginate "repos/$REPO/releases/$borrador/assets?per_page=100" --jq '.[].name')"

          fallos=0
          for f in release/*; do
            [ -f "$f" ] || continue
            nombre="$(basename "$f")"
            if ! grep -Fxq "$nombre" <<< "$nombres"; then
              echo "falta $nombre en $TAG" >&2
              fallos=1
            fi
          done

          if ! grep -Fxq 'latest.json' <<< "$nombres"; then
            echo "falta latest.json en $TAG: /releases/latest/download/latest.json dará 404" >&2
            fallos=1
          fi

          if ! grep -q '\.sig$' <<< "$nombres"; then
            echo "no hay ningún .sig en $TAG: el updater rechazaría la descarga" >&2
            fallos=1
          fi

          # El `latest.json` tiene que anunciar las dos entradas de Windows con url y firma: es lo
          # que consulta la aplicación y lo que el paso de actualización comprueba.
          if grep -Fxq 'latest.json' <<< "$nombres"; then
            id="$(gh api "repos/$REPO/releases/$borrador/assets?per_page=100" \
              --jq '.[] | select(.name == "latest.json") | .id')"
            gh api "repos/$REPO/releases/assets/$id" -H 'Accept: application/octet-stream' \
              > "$RUNNER_TEMP/latest.json"
            jq -e '
              .platforms["windows-x86_64"].url and
              .platforms["windows-x86_64"].signature and
              .platforms["windows-x86_64-portable"].url and
              .platforms["windows-x86_64-portable"].signature
            ' "$RUNNER_TEMP/latest.json" >/dev/null ||
              { echo "latest.json no anuncia windows-x86_64 y windows-x86_64-portable con url y firma" >&2; fallos=1; }
          fi

          if [ "$fallos" -ne 0 ]; then
            echo "la release quedó incompleta y no se publica" >&2
            exit 1
          fi

          # Sólo cuando los assets están comprobados se quita el borrador: una release
          # publicada a medias no se puede arreglar sin borrarla.
          gh api --method PATCH "repos/$REPO/releases/$borrador" \
            -F draft=false -F make_latest=true >/dev/null

          sigue_borrador="$(gh api "repos/$REPO/releases/$borrador" --jq '.draft')"
          if [ "$sigue_borrador" != "false" ]; then
            echo "$TAG sigue en borrador" >&2
            exit 1
          fi

          echo "publicada: $TAG (id $borrador, $(wc -l <<< "$nombres" | tr -d ' ') assets)"
