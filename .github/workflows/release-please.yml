name: Release Please

# El changelog y el número de versión, a partir de los Conventional Commits que ya se escriben.
#
# Abre un PR de release con el `CHANGELOG.md` escrito y la versión subida en los diez `package.json`.
# Mientras ese PR no se fusione, no pasa nada más. Al fusionarlo, `release-please` crea el tag
# `vX.Y.Z` y deja la release **en borrador**.
#
# **El tag no dispara `release.yml` por sí solo.** Lo crea esta acción con el `GITHUB_TOKEN`, y
# GitHub no inicia workflows por eventos de ese token. Por eso el último paso lanza `release.yml`
# a mano con `workflow_dispatch` —que sí está exento— sobre el tag recién creado. Sin ese paso, la
# release se queda en borrador; pasó con la 0.3.1.
#
# Las dos opciones de `release-please-config.json` que hacen falta siguen siendo las mismas:
#
#  - `force-tag-creation`: el tag tiene que existir antes de que se lance `release.yml`; sin esto
#    GitHub no lo crea hasta que la release se publica, y el dispatch no tendría ref.
#  - `draft`: la release nace en borrador para que nadie vea una release a la que todavía le faltan
#    los instaladores.
#
# El **cuerpo** del PR tampoco se escribe aquí: `pull-request-header` y `pull-request-footer` están
# en el JSON, los dos con un espacio. Con la cadena vacía no vale, porque release-please hace
# `header || DEFAULT_HEADER` y vuelve a su cabecera «:robot: I have created a release *beep* *boop*»
# y a su pie «This PR was generated with Release Please». Un espacio es lo único que deja el PR en el
# CHANGELOG y nada más. Está explicado en `docs/release.md`.
#
# **Requiere un ajuste del repositorio**: en Settings → Actions → General → Workflow permissions hay
# que marcar «Allow GitHub Actions to create and approve pull requests». Sin eso, `GITHUB_TOKEN` no
# puede abrir el PR de release y este workflow falla. Está dicho en `docs/release.md`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Para lanzar `release.yml` con `gh workflow run` desde el paso final.
  actions: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # `release_created` sólo es «true» en el push que fusiona el PR de release. En los demás,
      # este paso no hace nada. El `--ref` es el tag que acaba de crear la acción; `release.yml`
      # lo usa como `github.ref_type=tag`, así que valida `version:check` y publica.
      - name: Lanzar la release del tag recién creado
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref "$TAG" -f publish=true
          echo "release.yml lanzado para $TAG"
