name: CI

# El listón, en cada push. Sin esto, las mitigaciones de `tests/seguridad.test.ts` y la auditoría
# limpia de dependencias son una promesa del último que las miró, no una condición de entrada.
#
# La versión de Bun está fijada a propósito: `bun.lock` es la fuente de verdad de las dependencias,
# y una versión distinta del gestor puede resolverlas de otra forma. Si se sube aquí, que se suba
# también `engines.bun` en `package.json`, en el mismo commit.
#
# Las acciones de terceros van fijadas **por SHA de commit**, no por etiqueta: una etiqueta se puede
# mover, y quien pueda moverla puede ejecutar lo que quiera en este repositorio con el token del
# workflow. El comentario dice a qué versión corresponde cada SHA; Dependabot lo reescribe al
# proponer una actualización.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      # `restore-keys` sin el hash deja una caché anterior cuando `bun.lock` cambia: no acierta
      # del todo, pero ahorra la descarga de lo que no se movió.
      - name: Caché de Bun
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # `--frozen-lockfile` falla si `bun.lock` no cuadra con los `package.json`: es lo que impide
      # que una dependencia entre sin pasar por revisión.
      - name: Instalar
        run: bun install --frozen-lockfile

      # El gancho se instala una vez por clon y `scripts/git-hooks.test.ts` lo
      # comprueba: sin este paso, el trabajo falla por una configuración que
      # depende del clon y no del código.
      - name: Instalar el gancho de pre-commit
        run: bun run hooks:instalar

      # La versión tiene que ser la misma en los diez `package.json`: si divergen, el binario y los
      # instaladores de una release dirían cosas distintas y nada lo impediría.
      - name: Versión
        run: bun run version:check

      - name: Auditoría de dependencias
        run: bun audit

      - name: Tipos
        run: bun run typecheck

      # `biome check` comprueba lint **y** formato: no hace falta un paso aparte de formateo, y
      # añadirlo sería tener dos herramientas donde el repositorio eligió una.
      - name: Estilo y formato
        run: bun run lint

      - name: Pruebas
        run: bun test

  # El e2e vive aparte: necesita Chromium y un servidor, y tarda lo que tarda. Que falle aquí no
  # debe tapar que los tipos o las pruebas unitarias están rojos, y al revés.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Caché de Bun
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Instalar
        run: bun install --frozen-lockfile

      - name: Instalar Chromium
        run: bun run e2e:install

      - name: Extremo a extremo
        run: bun run e2e:todo

  # El empaquetado, en las tres plataformas, **en cada push**. No es una repetición del trabajo de
  # calidad: lo que se comprueba aquí es el ejecutable y su instalador, que es lo que recibe quien
  # instala la aplicación. Un `bun build --compile` sale verde y produce un programa que arranca sin
  # interfaz y sin migraciones —pasó—, y eso sólo lo ve quien lo ejecuta.
  #
  # Se arma el instalador entero y no sólo el ejecutable por dos motivos. El primero: quien mantiene
  # esto no tiene por qué tener NSIS, `nfpm` ni un Mac a mano — **compila GitHub**. El segundo: un
  # error en el script de NSIS o en el `.dmg` se descubre en el push que lo introdujo, y no el día de
  # la release, que es el peor día para descubrirlo.
  empaquetado:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Caché de Bun
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Instalar
        run: bun install --frozen-lockfile

      - name: Instalar el gancho de pre-commit
        run: bun run hooks:instalar

      # Las pruebas también aquí y no sólo en Linux: el repositorio tiene caminos que dependen del
      # sistema —las rutas de los datos, los enlaces simbólicos de Windows— y probarlos en un solo
      # sistema es probar la mitad.
      - name: Pruebas
        run: bun test

      - name: Construir la interfaz
        run: bun run build

      # NSIS en Windows, `nfpm` y `appimagetool` en Linux, con sus hashes comprobados. En macOS no
      # hace falta nada: `hdiutil` viene con el sistema.
      - name: Preparar las herramientas de empaquetado
        uses: ./.github/actions/herramientas

      # Si `hdiutil` se queda sin sitio, este número dice cuánto había. Sin él, el fallo es «No space
      # left on device» y no se sabe de qué volumen: los runners de macOS traen la imagen cargada de
      # herramientas y el espacio libre no es el que uno supondría.
      - name: Espacio en disco (macOS)
        if: runner.os == 'macOS'
        run: df -h

      # El anfitrión de ventana, **antes** del paquete: el instalador lo mete al
      # lado del servidor y `bun run package` se niega a armar uno sin él, porque
      # sin anfitrión el acceso del escritorio abre una consola.
      - name: Rust al día
        run: rustup update stable --no-self-update

      - name: Dependencias del webview (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - name: Caché de cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Compilar el anfitrión
        run: bun run desktop:build

      # Compila el ejecutable de esta plataforma, lo arranca de verdad —interfaz, recursos, token de
      # arranque y base migrada— y arma su instalador.
      - name: Empaquetar, probar y armar el instalador
        run: bun run package

      # El instalador queda descargable desde la página del workflow, sin que nadie compile en su
      # máquina. Sin firmar: un push no tiene los certificados, y el README explica los avisos que
      # eso deja.
      - name: Dejar el instalador descargable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nn-anime-${{ matrix.os }}
          path: |
            build/package/*/nn-anime
            build/package/*/nn-anime.exe
            release/*
          if-no-files-found: error
          retention-days: 7

  # El árbol de Rust del anfitrión de ventana (`desktop/`).
  #
  # Existe porque **nadie más lo mira**: vive fuera de `packages/` a propósito, así
  # que `tsc`, `bun test` y biome no ven una sola línea suya. Sin este trabajo, el
  # módulo que da la ventana sería el único del repositorio sin nadie que lo mida.
  #
  # Se compila además de pasar las pruebas: el fallo que importa aquí es de enlace
  # y de configuración —`tauri.conf.json`, las dependencias del webview de Linux—,
  # y ése no lo ve `cargo test`.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      # El `rustup` que ya traen las imágenes de los tres runners, actualizado en
      # vez de una acción de terceros: una acción más es un SHA más que auditar, y
      # `tauri-plugin-single-instance` sólo pide Rust >= 1.90.
      - name: Rust al día
        run: rustup update stable --no-self-update

      # El webview de Linux no viene en la imagen. Es la única dependencia del
      # sistema que el anfitrión necesita y sólo la necesita ahí: Windows usa
      # WebView2, que ya está, y macOS usa WKWebView, que es del sistema.
      - name: Dependencias del webview (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - name: Caché de cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # `desktop:check` es `cargo fmt --check`, `cargo clippy -D warnings` y
      # `cargo test`. El script y no los tres comandos sueltos: el listón vive en
      # un solo sitio, y es el mismo que corre quien lo compila a mano.
      - name: Listón del anfitrión
        run: bun run desktop:check

      - name: Compilar el anfitrión
        run: bun run desktop:build
